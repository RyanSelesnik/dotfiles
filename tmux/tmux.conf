# ~/.tmux.conf - The Ultimate Tmux Configuration

# ============================================
# GENERAL SETTINGS
# ============================================

# Use 256 colors and true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable Kitty graphics protocol passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Increase scrollback buffer size
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Eliminate escape delay (critical for vim users)
set -sg escape-time 0

# Increase repeat time for repeatable commands
set -g repeat-time 300

# Enable focus events (useful for vim autoread)
set -g focus-events on

# ============================================
# PREFIX KEY
# ============================================

# Change prefix from C-b to C-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ============================================
# KEY BINDINGS
# ============================================

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Intuitive split commands (and keep current path)
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + arrow keys to switch panes (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + arrow to switch windows (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Ctrl+A + arrow to switch windows (after prefix)
bind Left previous-window
bind Right next-window

# Pane resizing with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Synchronize panes toggle
bind S setw synchronize-panes

# ============================================
# COPY MODE (Vi-style)
# ============================================

setw -g mode-keys vi

# Enter copy mode with prefix + [
bind [ copy-mode

# Vi-style selection and copying
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# System clipboard integration (macOS)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# For Linux, use: "xclip -selection clipboard" instead of "pbcopy"

# ============================================
# MOUSE SUPPORT
# ============================================

set -g mouse on

# ============================================
# STATUS BAR
# ============================================

# Update status every second
set -g status-interval 1

# Status bar position
set -g status-position bottom

# Status bar colors
set -g status-style bg=colour235,fg=colour137

# Left side: session name
set -g status-left-length 40
set -g status-left '#[fg=colour232,bg=colour154,bold] #S #[fg=colour154,bg=colour235,nobold]'

# Right side: date and time
set -g status-right-length 60
set -g status-right '#[fg=colour250] %a %b %d #[fg=colour255,bold] %H:%M:%S '

# Window status
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# ============================================
# PANE BORDERS
# ============================================

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour154

# ============================================
# MESSAGES
# ============================================

set -g message-style bg=colour166,fg=colour232,bold
set -g display-time 2000

# ============================================
# ACTIVITY MONITORING
# ============================================

setw -g monitor-activity on
set -g visual-activity off

# ============================================
# PLUGINS (via TPM - Tmux Plugin Manager)
# ============================================

# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'           # System clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'      # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'      # Auto-save sessions
set -g @plugin 'christoomey/vim-tmux-navigator'   # Seamless vim/tmux navigation

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
